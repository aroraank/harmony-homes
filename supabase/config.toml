# Supabase CLI config (used for `supabase start` locally and `supabase functions deploy`)
project_id = "harmony-homes"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Members never sign up themselves through Supabase Auth: logins are created by the
# super admin (bulk) or by the `account` Edge Function (self-registration, pending approval).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "5MiB"

# JWTs are verified inside each function (works with both legacy and new API keys).
[functions.admin-users]
verify_jwt = false

[functions.account]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false
